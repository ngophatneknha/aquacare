<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AQUA CARE - giám sát và cảnh báo sớm chất lượng nước thải công nghiệp" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 6.5 9 11.3 9 16a9 9 0 0 1-18 0c0-4.7 4-9.5 9-16z' fill='%230a7fa0'/%3E%3C/svg%3E" />
    <title>AQUA CARE</title>
    <script>
      // Đặt theme trước khi vẽ trang để không bị nháy sáng/tối
      try {
        var t = localStorage.getItem('aquacare-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
